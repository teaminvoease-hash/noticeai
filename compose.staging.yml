name: resolvex-staging
services:
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27120:27017"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["staging_mongo:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if(db.hello().isWritablePrimary) quit(0); rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}); quit(1); } catch(e) { quit(1); }'"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    depends_on:
      mongo: {condition: service_healthy}
    ports: ["127.0.0.1:6080:6080"]
    environment:
      APP_ENV: staging
      NODE_ENV: development
      PORT: 6080
      APP_ORIGIN: http://localhost:6080
      MONGODB_URI: mongodb://mongo:27017/noticeai_staging?replicaSet=rs0
      STAGING_DATABASE_NAME: noticeai_staging
      SESSION_COOKIE_NAME: resolvex.staging.sid
      SESSION_SECRET: ${STAGING_SESSION_SECRET:?Set STAGING_SESSION_SECRET to at least 32 random characters}
      UPLOAD_STORAGE: gridfs
      AI_FEATURES_ENABLED: "false"
      PAYU_IS_LIVE: "false"
      STAGING_ALLOW_EXTERNAL_DELIVERY: "false"
volumes:
  staging_mongo:
